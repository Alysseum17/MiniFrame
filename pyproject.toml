[project]
name = "miniframe"
version = "0.1.0"
description = "A lightweight columnar DataFrame engine built from scratch in Python."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage",
    "duckdb",
    "hypothesis",
    "mutmut",
    "pandas",
    "polars",
    "pyarrow",
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "ruff",
]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
exclude = ["docs/design-doc.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["miniframe"]

[tool.mutmut]
source_paths = ["miniframe/"]
pytest_add_cli_args_test_selection = ["tests/"]
